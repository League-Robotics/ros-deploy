---
# playbooks/site.yml
# Master playbook — applies all roles to all groups.
# Run: ansible-playbook playbooks/site.yml

- name: Apply common baseline to every managed host
  hosts: ros_all
  become: true
  roles:
    - common

- name: Install ROS 2 on physical/VM nodes
  hosts: ros_nodes
  become: true
  roles:
    - ros

- name: Provision the shared ros working account
  hosts: ros_nodes
  become: true
  roles:
    - ros_user

- name: Build the heartbeat connectivity-check package
  hosts: ros_nodes
  become: true
  roles:
    - heartbeat

- name: Install and run ROS 2 cameras
  hosts: ros_nodes
  become: true
  roles:
    - role: cameras
      when: install_cameras | default(false)

- name: Configure X Windows forwarding
  hosts: ros_all
  become: true
  roles:
    - role: xwindows
      when: configure_xwindows | default(false)

- name: Install XFCE + VNC desktop (standard on Raspberry Pis)
  hosts: ros_all
  become: true
  roles:
    - role: desktop
      when: configure_desktop | default(false)

- name: Install Docker and deploy ROS containers
  hosts: ros_docker_hosts
  become: true
  roles:
    - docker
    - ros_docker
