---
# playbooks/site.yml
# Master playbook — applies all roles to all groups.
# Run: ansible-playbook playbooks/site.yml

- name: Apply common baseline to every managed host
  hosts: ros_all
  become: true
  roles:
    - common

# WiFi first: the Pis must share the fleet's WiFi (Busboom Mesh) or DDS
# multicast discovery silently fails (see roles/wifi). Needs WIFI_MESH_PSK in
# the environment from the encrypted dotconfig secrets.
- name: Configure fleet WiFi (Busboom Mesh)
  hosts: raspberry_pis
  become: true
  roles:
    - role: wifi
      when: configure_wifi | default(false)

- name: Install ROS 2 on physical/VM nodes
  hosts: ros_nodes
  become: true
  roles:
    - ros

- name: Provision the shared ros working account
  hosts: ros_nodes
  become: true
  roles:
    - ros_user

- name: Build the heartbeat connectivity-check package
  hosts: ros_nodes
  become: true
  roles:
    - heartbeat

# After ros_user: the shared world/model directory is group-owned by the `ros`
# account so worlds can be dropped in without sudo.
- name: Install Gazebo and the ROS <-> Gazebo bridge on simulation hosts
  hosts: ros_nodes
  become: true
  roles:
    - role: gazebo
      when: install_gazebo | default(false)

# Collect ROS packages from the LeagueRobotics org (repos tagged with the fleet
# topic + a fleet.yaml manifest) and build the ones targeted at each node. The
# control machine clones into .fleet/staging and writes .fleet/packages.lock.yml;
# set fleet_collect=false to deploy from the committed lockfile without GitHub.
# See docs/fleet-packages.md.
- name: Collect fleet ROS packages from the LeagueRobotics org
  hosts: localhost
  gather_facts: false
  run_once: true
  tasks:
    - name: Run package collection (discover + clone + lock)
      ansible.builtin.command:
        cmd: python3 {{ playbook_dir }}/../scripts/collect_fleet_packages.py --org {{ fleet_org }} --topic {{ fleet_topic }}
        chdir: "{{ playbook_dir }}/.."
      changed_when: false
      when: fleet_collect | default(true)

- name: Distribute and build fleet ROS packages
  hosts: ros_nodes
  become: true
  roles:
    - fleet_packages

- name: Install and run ROS 2 cameras
  hosts: ros_nodes
  become: true
  roles:
    - role: cameras
      when: install_cameras | default(false)

- name: Install the rosbridge WebSocket gateway (JSON bridge for non-ROS clients)
  hosts: rosbridge_hosts
  become: true
  roles:
    - role: rosbridge

- name: Install the plug-and-play ROS joystick publisher
  hosts: ros_nodes
  become: true
  roles:
    - role: joy
      when: install_joy | default(false)

# REV Hub serial library must be present before the xdrive driver service starts.
- name: Install the REV Hub control library + serial access
  hosts: ros_nodes
  become: true
  roles:
    - role: revhub
      when: install_revhub | default(false)

# Build the in-repo xdrive package and run its services: the driver on the robot
# (xdrive_run_driver), the joystick->Twist mapper on the operator host
# (xdrive_run_joy_to_twist).
- name: Build xdrive and run the X-drive teleop services
  hosts: ros_nodes
  become: true
  roles:
    - role: xdrive
      when: (xdrive_run_driver | default(false)) or (xdrive_run_joy_to_twist | default(false))

# Differential-drive joystick teleop (roles/diffdrive_teleop). Separate from the
# xdrive play above: that one is the holonomic X-drive, this one is two-wheel
# drive+turn with no strafe. A host runs one or the other, not both.
- name: Install differential-drive joystick teleop
  hosts: ros_nodes
  become: true
  roles:
    - role: diffdrive_teleop
      when: diffdrive_teleop_enabled | default(false)

- name: Configure X Windows forwarding
  hosts: ros_all
  become: true
  roles:
    - role: xwindows
      when: configure_xwindows | default(false)

- name: Install XFCE + VNC desktop (standard on Raspberry Pis)
  hosts: ros_all
  become: true
  roles:
    - role: desktop
      when: configure_desktop | default(false)

- name: Install Docker and deploy ROS containers
  hosts: ros_docker_hosts
  become: true
  roles:
    - docker
    - ros_docker
