# inventory/host_vars/baldur.yml
# Per-host overrides for `baldur` (Raspberry Pi 4 Model B, Ubuntu 24.04).
# Ubuntu 24.04 → ROS 2 Kilted Kaiju.

# ── Cameras ───────────────────────────────────────────────
# baldur has a single CSI camera: an IMX219 (Raspberry Pi Camera Module v2),
# detected at i2c@1/imx219@10. Install camera_ros and run one node, publishing
# under /camera0/* on ROS_DOMAIN_ID 42 for fleet-wide viewing.
install_cameras: true
# Pi 4 uses the VC4/Unicam libcamera pipeline (bcm2835-unicam), NOT the Pi 5
# CFE/PiSP. The upstream libcamera shipped with camera_ros drives that path, so
# the rpi-libcamera fork build (needed on Pi 5, e.g. vidar) is NOT required here.
cameras_build_rpi_libcamera: false
# Serve the camera as MJPEG over HTTP (view in a browser, e.g. from the Mac):
#   http://baldur:8080/stream_viewer?topic=/camera0/camera/image_raw
cameras_web_video_server: true
# NO colour relay on baldur. The relay exists to undo a camera_ros R/B swap seen
# with vidar's rpi-libcamera FORK (Pi 5). baldur runs STOCK Ubuntu libcamera
# (Pi 4 / vc4 pipeline), which already publishes correct RGB on image_raw — so
# the relay would *introduce* the swap. View /camera0/camera/image_raw directly.
cameras_color_relay: false
# Auto-restart the camera if libcamera stalls (publishes nothing without crashing).
cameras_watchdog: true
cameras_list:
  - namespace: camera0
    camera: 0
    width: 640
    height: 480
    format: RGB888
    frame_id: camera0_optical_frame

# ── X-drive teleop (REV Hub) ──────────────────────────────
# baldur drives a 4-motor X-drive robot via a REV Hub on USB serial
# (FTDI FT230X -> /dev/ttyUSB0, 0403:6015, serial DQ2EXYCG). The hub is found
# automatically by rhsp.enumerate_hubs(), so serial_port stays "auto".
install_revhub: true          # install the rhsp library + serial access (roles/revhub)
xdrive_run_driver: true       # run the cmd_vel -> REV Hub driver service (roles/xdrive)
xdrive_run_joy_to_twist: false  # the joystick mapping happens on golem, not here
# BENCH: per-motor sweep showed the front motors need ~12000 (~37%) to break
# stiction; 6553 (20%) only moved the rear pair. 16000 (~49%) gives margin so
# full-stick commands move all four wheels. NOTE: combined commands give a wheel
# a fraction of this, which can fall below the stiction floor (low-input deadband)
# — tune / add min-power compensation when driving on the ground.
# Flip any backwards wheel in xdrive_wheel_signs [fl,fr,rl,rr] during ground calibration.
xdrive_max_power: 16000
xdrive_cmd_timeout_ms: 500
xdrive_wheel_signs: "[1,1,1,1]"
# Hub port for each wheel [front_left, front_right, rear_left, rear_right],
# from the motor-id sweep: port0=rear-right, port1=rear-left, port2=front-left,
# port3=front-right (clockwise wiring). So FL->2, FR->3, RL->1, RR->0.
xdrive_motor_ports: "[2,3,1,0]"
