# inventory/host_vars/vidar.yml
# Per-host overrides for the `vidar` node (Ubuntu 24.04).
# Ubuntu 24.04 → ROS 2 Kilted Kaiju.

ros_version: kilted
ros_package_variant: ros-base

# ── Cameras ───────────────────────────────────────────────
# vidar is a Raspberry Pi 5 with two CSI cameras (libcamera). Install
# camera_ros and run one node per camera. Topics are published under
# /camera0/* and /camera1/* on ROS_DOMAIN_ID 42 for fleet-wide viewing.
install_cameras: true
# Pi 5 + Ubuntu: build the Raspberry Pi libcamera fork so camera_ros can drive
# the CSI cameras (upstream libcamera can't acquire the Pi CFE).
cameras_build_rpi_libcamera: true
# Serve the cameras as MJPEG over HTTP (view in a browser, e.g. from the Mac):
#   http://vidar:8080/stream_viewer?topic=/camera0/camera/image_raw
cameras_web_video_server: true
# camera_ros swaps R/B vs its encoding label; relay corrects it to image_color.
# View the image_color topics (e.g. /camera0/camera/image_color).
cameras_color_relay: true
# Auto-restart the cameras if they stall (camera_ros can stop publishing
# without crashing); web_video_server restarts with them via PartOf.
cameras_watchdog: true
cameras_list:
  - namespace: camera0
    camera: 0
    width: 640
    height: 480
    format: RGB888
    frame_id: camera0_optical_frame
  - namespace: camera1
    camera: 1
    width: 640
    height: 480
    format: RGB888
    frame_id: camera1_optical_frame
