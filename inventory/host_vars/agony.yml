# inventory/host_vars/agony.yml
# Per-host overrides for the `agony` workstation (amd64, Ubuntu 24.04).

# Account that owns the XFCE/TurboVNC session installed by roles/desktop.
# Must be an existing local user account on the host.
desktop_user: eric

# rosbridge is enabled via membership in the [rosbridge_hosts] group (hosts.ini),
# no per-host flag needed. agony serves the gateway at ws://agony:9090.
