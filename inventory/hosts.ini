# ============================================================
# Example inventory for ros-deploy
# Copy this file to hosts.ini and adjust to your environment.
# ============================================================

# ── ROS Master (runs roscore for ROS 1, or acts as the
#    "primary" domain member for ROS 2) ─────────────────────
[ros_master]
ros-master ansible_host=192.168.1.10 ansible_user=ubuntu

# ── Physical / VM worker nodes ────────────────────────────
[ros_workers]
robot1    ansible_host=192.168.1.11 ansible_user=ubuntu
raspi1    ansible_host=192.168.1.20 ansible_user=pi

# ── Hosts that will run ROS inside Docker ─────────────────
[ros_docker_hosts]
docker-host1 ansible_host=192.168.1.30 ansible_user=ubuntu

# ── Convenience group: all ROS nodes ──────────────────────
[ros_nodes:children]
ros_master
ros_workers
ros_docker_hosts

# ── Group-level variables can override group_vars/ files ──
[ros_workers:vars]
# raspi1 runs 64-bit Ubuntu on a Raspberry Pi 4
# Override per-host if needed:
#   raspi1 ros_arch=arm64

[ros_docker_hosts:vars]
ros_in_docker=true
