# ============================================================
# inventory/hosts.ini  —  adjust host addresses to your environment.
# ansible_user and private_key_file are set globally in ansible.cfg
# (remote_user=ansible, private_key_file=config/files/ansible).
# Run `./scripts/bootstrap-ansible-user.sh` once per new host to
# create the ansible account before running any other playbook.
# ============================================================

[ros_nodes]
agony        ansible_host=192.168.1.11
torture      ansible_host=192.168.1.12
vidar        ansible_host=192.168.1.144
nepr         ansible_host=192.168.1.146
baldur       ansible_host=192.168.1.152
ali          ansible_host=192.168.1.143

[ros_docker_hosts]
docker-host1 ansible_host=192.168.1.30

# ── Raspberry Pis ─────────────────────────────────────────
# All Pis get a VNC desktop (configure_desktop in group_vars/raspberry_pis.yml).
# Hosts inherit their ansible_host from the group above; just list names here.
[raspberry_pis]
vidar
nepr
baldur
ali

# ── Convenience group: every ROS host ─────────────────────
[ros_all:children]
ros_nodes
ros_docker_hosts

[ros_docker_hosts:vars]
ros_in_docker=true
