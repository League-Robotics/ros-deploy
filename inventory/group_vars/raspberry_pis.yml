# inventory/group_vars/raspberry_pis.yml
# Variables shared by every Raspberry Pi in the fleet.

# Standard for all Pis: run a VNC desktop (XFCE + TigerVNC on aarch64) so any
# Pi can be reached graphically. The desktop role auto-selects TigerVNC on
# aarch64. VNC listens on display :1 (port 5901), password `desktop_vnc_password`.
configure_desktop: true

# Require a VNC password on the Pis. TigerVNC's password-less mode advertises
# only RFB SecurityType "None", which macOS Screen Sharing.app refuses (it shows
# "Screen Sharing requires a password to sign in"). With a password the server
# advertises VNC-auth (RFB type 2), which Screen Sharing.app accepts. amd64
# (TurboVNC) hosts are unaffected and keep their own all.yml default.
desktop_vnc_no_password: false
desktop_vnc_password: code4life

# Account that owns the VNC session. Defaults to the `ansible` service account
# (always present); override in a host's host_vars for a human login if desired.
desktop_user: ansible

# Plug-and-play joystick publisher (roles/joy): every Pi auto-publishes any
# controller plugged into it as sensor_msgs/Joy on /<hostname>/joy/<N>. Idle
# until a joystick appears.
install_joy: true

# Keep every Pi on the fleet WiFi (roles/wifi → "Busboom Mesh"). Required for
# DDS multicast discovery; a Pi on a different SSID is invisible to the fleet.
configure_wifi: true

# Give every Pi a static Ethernet address as well (roles/wired). The fleet is
# dual-homed: WiFi carries the default route and DNS, Ethernet adds a second
# address on the same /21 at 192.168.2.<same last octet>, published in DNS as
# <host>-en. Wired is the stable path — the WiFi link shows multi-hundred-ms
# latency spikes under load, which stalls camera streams.
configure_wired: true

# ── pi_model (per-host, NOT set here on purpose) ──────────
# Each Pi's host_vars carries `pi_model: "3" | "4" | "5" | "zero2w"`, which
# scripts/reimage-pi.sh reads to fill in flash-pi-card.sh's --model flag. It is
# documentation only — no Ansible role consumes it.
#
# There is deliberately NO group-level default. A Pi 5 silently inheriting a
# default of "4" is exactly the mistake the picker exists to prevent, so an
# unset model must mean "stop and ask the operator", not "assume the common
# case". When adding a new Pi, set pi_model in its host_vars file.
