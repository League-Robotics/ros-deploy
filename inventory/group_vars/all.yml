# ============================================================
# group_vars/all.yml  —  variables that apply to every host
# ============================================================

# ── ROS version ──────────────────────────────────────────
# Supported: humble  (ROS 2, Ubuntu 22.04)
#            kilted  (ROS 2, Ubuntu 24.04)
#            lyrical (ROS 2, Ubuntu 26.04)
#
# Dictated by the host's Ubuntu release, not chosen: packages.ros.org builds one
# ROS distro per Ubuntu suite. Override in host_vars for any host that isn't on
# 24.04 (currently buzzkill, which is 26.04 -> lyrical).
ros_version: kilted

# ── ROS package variant ──────────────────────────────────
# ros-base : minimal (recommended for robots / headless)
# desktop  : includes rviz, rqt, and other GUI tools
ros_package_variant: ros-base

# ── Architecture handling ─────────────────────────────────
# Ansible detects ansible_architecture automatically.
# Supported values: x86_64  aarch64  armv7l
# You can override per host in host_vars/<hostname>.yml

# ── ROS 2 networking ──────────────────────────────────────
# All nodes sharing the same domain ID discover each other
# automatically via DDS multicast / unicast peers.
ros_domain_id: 42

# Each node advertises itself by its primary ansible_host
# address so that all peers on the network can reach it.
ros_node_ip: "{{ ansible_host }}"

# ── X Windows ─────────────────────────────────────────────
# Whether to configure the host for X11 forwarding over SSH
configure_xwindows: false

# ── Desktop / VNC ─────────────────────────────────────────
# Whether to install the XFCE + VNC desktop (roles/desktop). Enabled fleet-wide
# for Raspberry Pis via group_vars/raspberry_pis.yml.
configure_desktop: false

# ── Docker ────────────────────────────────────────────────
# Whether to install Docker CE on the host
install_docker: false

# Whether to run the ROS service inside Docker
ros_in_docker: false

# ── Cameras ───────────────────────────────────────────────
# Whether to install ROS camera support (camera_ros / libcamera) and run
# the cameras listed in `cameras_list`. Enable + define cameras per host in
# inventory/host_vars/<host>.yml.
install_cameras: false

# ── rosbridge gateway ─────────────────────────────────────
# rosbridge_server (roles/rosbridge) is a JSON/WebSocket gateway letting non-ROS
# clients (roslibpy, roslib.js) pub/sub ROS topics without the ROS stack. It is
# enabled by adding a host to the [rosbridge_hosts] group in inventory/hosts.ini
# (no per-host flag); the playbooks target that group directly.

# ── Joystick publisher ────────────────────────────────────
# Whether to install the plug-and-play joystick publisher (roles/joy): hosts do
# nothing until a controller is plugged in, then auto-publish sensor_msgs/Joy on
# /<hostname>/joy/<N>. Enabled for the raspberry_pis group.
install_joy: false

# ── REV Hub serial + X-drive teleop ───────────────────────
# install_revhub: install the rhsp REV Hub control library + serial (dialout +
#   /dev/revhub udev) so a node can drive a REV Robotics Hub over USB serial
#   (roles/revhub). Enabled per host (baldur).
# The xdrive role (roles/xdrive) builds the in-repo ros_pkgs/xdrive package and
# runs its nodes where flagged: xdrive_run_driver (cmd_vel -> motors, on the
# robot) and xdrive_run_joy_to_twist (Joy -> cmd_vel, on the operator station).
install_revhub: false

# ── Gazebo simulation ─────────────────────────────────────
# Whether to install the Gazebo simulator + ros_gz bridge (roles/gazebo). The
# Gazebo release is derived from ros_version (REP-2000 pairing: kilted ->
# Ionic), and everything comes from the ROS apt repo as vendor packages. A sim
# host joins the same DDS domain as the real robots, so a node can be pointed
# at simulation instead of hardware unchanged. Enabled per host (buzzkill).
install_gazebo: false

# ── Fleet WiFi ────────────────────────────────────────────
# Whether to manage the host's WiFi connection (roles/wifi). Keeps the Pis on
# the shared "Busboom Mesh" SSID so DDS multicast discovery works. The PSK comes
# from the encrypted dotconfig secrets (WIFI_MESH_PSK). Enabled for raspberry_pis.
configure_wifi: false

# ── Fleet packages (roles/fleet_packages) ────────────────
# ROS packages collected from other repos in the LeagueRobotics GitHub org. A
# repo opts in by carrying the `fleet_topic` GitHub topic and a fleet.yaml
# manifest at its root (see docs/fleet-packages.md). The control machine scans
# the org, clones into .fleet/staging, and writes .fleet/packages.lock.yml; each
# node then builds the packages whose manifest targets its inventory group.
fleet_org: LeagueRobotics
fleet_topic: fleet-ros-package

# Whether the site/fleet_packages playbook re-scans GitHub before distributing.
# Set false (e.g. -e fleet_collect=false) to deploy from the committed lockfile
# without contacting GitHub — reproducible / offline runs.
fleet_collect: true

# Docker image tags used in docker-compose templates
ros_humble_image: "ros:humble-ros-base"
ros_kilted_image: "ros:kilted-ros-base"
# No docker/lyrical/Dockerfile in this repo yet — the upstream image exists, but
# roles/ros_docker's _ros_docker_image fact still needs a lyrical branch before
# ros_in_docker works on a 26.04 host. Add both if a Docker node moves to 26.04.
ros_lyrical_image: "ros:lyrical-ros-base"
