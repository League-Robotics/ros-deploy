---
# roles/xdrive/tasks/main.yml
# Build the in-repo xdrive package into the shared colcon workspace, then run the
# requested nodes as systemd services. The overlay-sourcing profile snippet
# (/etc/profile.d/ros_overlay.sh) is owned by roles/heartbeat, so we don't touch it.

# ── Build (mirrors roles/heartbeat) ──────────────────────────────────────────
- name: Ensure colcon workspace src/ directory exists
  ansible.builtin.file:
    path: "{{ xdrive_workspace_dir }}/src"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the pre-rename xdrive package from the workspace
  # The package was renamed xdrive -> revhub (2026-08-08). Leftover build
  # products would keep the old entry points on ros2's path forever.
  ansible.builtin.file:
    path: "{{ xdrive_workspace_dir }}/{{ item }}"
    state: absent
  loop:
    - src/xdrive
    - build/xdrive
    - install/xdrive

- name: Sync revhub package sources into the workspace
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../ros_pkgs/revhub/"
    dest: "{{ xdrive_workspace_dir }}/src/revhub/"
    delete: true
    rsync_opts:
      - "--exclude=build"
      - "--exclude=install"
      - "--exclude=log"
      - "--exclude=__pycache__"
      - "--exclude=*.egg-info"
  register: xdrive_sync

- name: Ensure python3-colcon-common-extensions is installed
  ansible.builtin.apt:
    name: python3-colcon-common-extensions
    state: present

- name: Check whether revhub install artifacts already exist
  ansible.builtin.stat:
    path: "{{ xdrive_workspace_dir }}/install/revhub"
  register: xdrive_install_stat

- name: Build revhub package with colcon
  ansible.builtin.shell: |
    set -eo pipefail
    source /opt/ros/{{ ros_version }}/setup.bash
    cd {{ xdrive_workspace_dir }}
    colcon build --packages-select revhub --symlink-install
  args:
    executable: /bin/bash
  when: xdrive_sync is changed or not xdrive_install_stat.stat.exists
  changed_when: true
  notify:
    - Restart xdrive driver
    - Restart joy to twist
    - Restart local teleop
    - Restart revhub
    - Restart motion control

# ── xdrive_driver service (robot side: baldur) ───────────────────────────────
- name: Deploy xdrive driver systemd unit
  ansible.builtin.template:
    src: xdrive-driver.service.j2
    dest: "/etc/systemd/system/{{ xdrive_driver_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: xdrive_run_driver | bool
  notify:
    - Reload systemd
    - Restart xdrive driver

- name: Enable and start the xdrive driver
  ansible.builtin.systemd:
    name: "{{ xdrive_driver_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: xdrive_run_driver | bool

- name: Remove the xdrive driver service when disabled
  when: not (xdrive_run_driver | bool)
  block:
    - name: Check whether the xdrive driver unit is present
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ xdrive_driver_service_name }}.service"
      register: _xdrive_driver_unit
    - name: Stop and disable the xdrive driver
      ansible.builtin.systemd:
        name: "{{ xdrive_driver_service_name }}"
        state: stopped
        enabled: false
      when: _xdrive_driver_unit.stat.exists
    - name: Remove the xdrive driver unit
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ xdrive_driver_service_name }}.service"
        state: absent
      notify: Reload systemd

# ── revhub + motion-control services (current robot architecture) ────────────
- name: Deploy the revhub and motion-control systemd units
  ansible.builtin.template:
    src: "{{ item.tmpl }}"
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { tmpl: revhub.service.j2, name: "{{ xdrive_revhub_service_name }}", run: "{{ xdrive_run_revhub }}" }
    - { tmpl: motion-control.service.j2, name: "{{ xdrive_motion_service_name }}", run: "{{ xdrive_run_motion_control }}" }
  when: item.run | bool
  notify:
    - Reload systemd
    - Restart revhub
    - Restart motion control

- name: Enable and start revhub / motion-control
  ansible.builtin.systemd:
    name: "{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - { name: "{{ xdrive_revhub_service_name }}", run: "{{ xdrive_run_revhub }}" }
    - { name: "{{ xdrive_motion_service_name }}", run: "{{ xdrive_run_motion_control }}" }
  when: item.run | bool

- name: Remove revhub / motion-control when disabled
  ansible.builtin.include_tasks: remove_unit.yml
  loop:
    - "{{ xdrive_revhub_service_name }}"
    - "{{ xdrive_motion_service_name }}"
  loop_control:
    loop_var: _unit_name
  when: >-
    (_unit_name == xdrive_revhub_service_name and not (xdrive_run_revhub | bool))
    or (_unit_name == xdrive_motion_service_name and not (xdrive_run_motion_control | bool))

# ── local teleop service (robot side; replaces driver+joy_to_twist) ──────────
- name: Deploy the local teleop systemd unit
  ansible.builtin.template:
    src: xdrive-local-teleop.service.j2
    dest: "/etc/systemd/system/{{ xdrive_local_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: xdrive_run_local_teleop | bool
  notify:
    - Reload systemd
    - Restart local teleop

- name: Enable and start the local teleop
  ansible.builtin.systemd:
    name: "{{ xdrive_local_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: xdrive_run_local_teleop | bool

- name: Remove the local teleop service when disabled
  when: not (xdrive_run_local_teleop | bool)
  block:
    - name: Check whether the local teleop unit is present
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ xdrive_local_service_name }}.service"
      register: _xdrive_local_unit
    - name: Stop and disable the local teleop
      ansible.builtin.systemd:
        name: "{{ xdrive_local_service_name }}"
        state: stopped
        enabled: false
      when: _xdrive_local_unit.stat.exists
    - name: Remove the local teleop unit
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ xdrive_local_service_name }}.service"
        state: absent
      notify: Reload systemd

# ── post-boot kick timer (robot side, with the driver) ───────────────────────
# The driver's first hub session after a cold power-on comes up dead ("ready"
# in the log, but commands are ignored and encoders freeze); a restart heals
# it. Restart once shortly after every boot until the driver self-recovers.
- name: Deploy the xdrive driver post-boot kick units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - xdrive-driver-kick.service
    - xdrive-driver-kick.timer
  when: xdrive_run_driver | bool
  notify: Reload systemd

- name: Enable the xdrive driver kick timer
  ansible.builtin.systemd:
    name: xdrive-driver-kick.timer
    enabled: true
    state: started
    daemon_reload: true
  when: xdrive_run_driver | bool

- name: Remove the kick units when the driver is disabled
  when: not (xdrive_run_driver | bool)
  block:
    - name: Check whether the kick timer is present
      ansible.builtin.stat:
        path: /etc/systemd/system/xdrive-driver-kick.timer
      register: _xdrive_kick_timer
    - name: Stop and disable the kick timer
      ansible.builtin.systemd:
        name: xdrive-driver-kick.timer
        state: stopped
        enabled: false
      when: _xdrive_kick_timer.stat.exists
    - name: Remove the kick unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - xdrive-driver-kick.service
        - xdrive-driver-kick.timer
      notify: Reload systemd

# ── joy_to_twist service (operator side: golem) ──────────────────────────────
- name: Deploy joy_to_twist systemd unit
  ansible.builtin.template:
    src: joy-to-twist.service.j2
    dest: "/etc/systemd/system/{{ xdrive_joy_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: xdrive_run_joy_to_twist | bool
  notify:
    - Reload systemd
    - Restart joy to twist

- name: Enable and start joy_to_twist
  ansible.builtin.systemd:
    name: "{{ xdrive_joy_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: xdrive_run_joy_to_twist | bool

- name: Remove the joy_to_twist service when disabled
  when: not (xdrive_run_joy_to_twist | bool)
  block:
    - name: Check whether the joy_to_twist unit is present
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ xdrive_joy_service_name }}.service"
      register: _xdrive_joy_unit
    - name: Stop and disable joy_to_twist
      ansible.builtin.systemd:
        name: "{{ xdrive_joy_service_name }}"
        state: stopped
        enabled: false
      when: _xdrive_joy_unit.stat.exists
    - name: Remove the joy_to_twist unit
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ xdrive_joy_service_name }}.service"
        state: absent
      notify: Reload systemd
