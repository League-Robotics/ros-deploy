---
# roles/ros/tasks/install_lyrical.yml
# Installs ROS 2 Lyrical Luth on Ubuntu 26.04 (Resolute), amd64 or arm64.
#
# Same repository mechanism as Kilted — the ros2-apt-source deb, which carries
# the signing key and the sources entry (see install_kilted.yml). Kept as its
# own file per the per-distro convention in AGENTS.md ("Add a new ROS distro").
#
# Ubuntu 26.04 is the only release Lyrical is built for, and conversely Resolute
# is the only suite on packages.ros.org that carries ros-lyrical-* — there is no
# Kilted build for 26.04. That is why a 26.04 host cannot simply join the rest of
# the fleet on Kilted. See docs/wiki/gazebo.md.

- name: Assert Ubuntu 26.04 (Resolute) for ROS 2 Lyrical
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version('26.04', '==')
    fail_msg: >
      ROS 2 Lyrical requires Ubuntu 26.04 (Resolute).
      Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}

- name: Ensure required locale packages are present
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Set system-wide locale to en_US.UTF-8
  ansible.builtin.command: update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
  changed_when: false

# NOT apt_repository with a one-line "deb ..." entry (the way install_kilted.yml
# does it): 26.04 keeps its sources in deb822 .sources files, and adding a
# legacy .list alongside them gives apt two conflicting definitions of the same
# suite. add-apt-repository edits the deb822 file in place and is a no-op when
# the component is already enabled — which on a stock 26.04 desktop it is.
- name: Ensure the universe component is enabled
  ansible.builtin.command: add-apt-repository -y universe
  register: _universe_enable
  changed_when: "'already enabled' not in _universe_enable.stdout"

- name: Install curl (required for repository setup)
  ansible.builtin.apt:
    name:
      - curl
      - software-properties-common
    state: present
    update_cache: true

- name: Fetch latest ros2-apt-source release metadata from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github.v3+json
  register: _ros_apt_source_release

- name: Set ros_apt_source_version fact
  ansible.builtin.set_fact:
    _ros_apt_source_version: "{{ _ros_apt_source_release.json.tag_name }}"

- name: Download ros2-apt-source deb package
  ansible.builtin.get_url:
    url: >-
      https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ _ros_apt_source_version }}/ros2-apt-source_{{ _ros_apt_source_version }}.{{ ansible_distribution_release }}_all.deb
    dest: /tmp/ros2-apt-source.deb
    mode: "0644"

- name: Install ros2-apt-source (configures ROS 2 apt repo and signing key)
  ansible.builtin.apt:
    deb: /tmp/ros2-apt-source.deb
    state: present

- name: Update apt cache after adding ROS 2 repository
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade existing packages before ROS install (best-effort)
  ansible.builtin.apt:
    upgrade: safe
    lock_timeout: 120
  register: _ros_pkg_upgrade
  # Opportunistic, not required for the ROS install below. Tolerate ONLY apt
  # refusing because a package would be downgraded (the apt module can't pass
  # --allow-downgrades); still fail on network, lock or broken-dep errors.
  failed_when:
    - _ros_pkg_upgrade is failed
    - "'allow-downgrades' not in (_ros_pkg_upgrade.msg | default(''))"

- name: Install ROS 2 Lyrical package
  ansible.builtin.apt:
    name: "ros-lyrical-{{ ros_package_variant }}"
    state: present
  notify: Source ROS environment

- name: Install ros-dev-tools (colcon, rosdep, vcstool, etc.)
  ansible.builtin.apt:
    name: ros-dev-tools
    state: present

- name: Initialise rosdep (skip if already done)
  ansible.builtin.command: rosdep init
  args:
    creates: /etc/ros/rosdep/sources.list.d/20-default.list
  register: ros_rosdep_init
  changed_when: ros_rosdep_init.rc == 0

- name: Update rosdep for the ansible user
  ansible.builtin.command: rosdep update
  become: false
  changed_when: true
