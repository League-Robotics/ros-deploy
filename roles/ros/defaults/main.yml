---
# roles/ros/defaults/main.yml

ros_version: kilted        # humble | kilted
ros_package_variant: ros-base  # ros-base | desktop

ros_domain_id: 42

# Resolved at runtime from group_vars/all.yml; keep defaults harmless.
ros_node_ip: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"

# Path where the ROS environment shell snippet is installed.
ros_env_profile_path: /etc/profile.d/ros_env.sh
