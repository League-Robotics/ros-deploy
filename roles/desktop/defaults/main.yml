---
# roles/desktop/defaults/main.yml

# Account that owns the VNC session, .vnc/passwd, the systemd --user
# service, and the per-user xdg-settings default browser.
# Falls back to the user Ansible connected as (typically `ansible`),
# but you almost certainly want to set this explicitly in host_vars/
# to your real desktop login — e.g. `desktop_user: eric`.
desktop_user: "{{ ansible_user | default(ansible_user_id) }}"
desktop_vnc_geometry: "1920x1080"
desktop_vnc_depth: 24
desktop_vnc_display: 1
desktop_vnc_password: "robotics"

# Allow VNC connections with NO authentication (SecurityTypes None). Enabled
# fleet-wide so any Pi desktop can be reached from macOS Screen Sharing
# (Finder -> Connect to Server -> vnc://<host>:5901) without a password. This
# is acceptable only because every Pi lives on the trusted "Busboom Mesh" LAN.
# When true, the .vnc/passwd step is skipped and the server starts with
# -SecurityTypes None. Set false to fall back to password auth.
desktop_vnc_no_password: true

# Display-manager session that local console logins default to. XFCE is the
# only session this role installs (it purges GNOME/ubuntu-desktop), so the
# stock "ubuntu" default points at a session that isn't present and the
# console login fails with "failed to start session". VNC is unaffected
# because it launches XFCE directly. Must match the .desktop name in
# /usr/share/xsessions (xfce.desktop -> "xfce").
desktop_session: xfce

# Install Firefox from the Mozilla apt repository (real .deb) instead of
# the Ubuntu snap shim, which does not work in VNC sessions. Required so
# OAuth flows (GitHub sign-in in VS Code, etc.) can open a browser.
desktop_install_firefox: true
