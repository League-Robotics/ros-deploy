---
# roles/desktop/tasks/main.yml
# Installs XFCE + VNC and starts VNC on boot.
# Uses TurboVNC on amd64, TigerVNC (from apt) on aarch64.
# Removes GNOME/GDM if present and replaces with LightDM.

- name: Install XFCE and dependencies
  ansible.builtin.apt:
    name:
      - xfce4
      - xfce4-terminal
      - xfce4-taskmanager
      - dbus-x11
      - lightdm
    state: present
    update_cache: true

- name: Remove GNOME and GDM
  ansible.builtin.apt:
    name:
      - gnome-shell
      - ubuntu-desktop
      - gdm3
    state: absent
    purge: true
  ignore_errors: true

- name: Autoremove orphaned GNOME packages
  ansible.builtin.apt:
    autoremove: true

- name: Set LightDM as default display manager
  ansible.builtin.copy:
    dest: /etc/X11/default-display-manager
    content: "/usr/sbin/lightdm\n"
    owner: root
    group: root
    mode: "0644"

# Without this, LightDM defaults users to the "ubuntu" session, which this role
# does not install (GNOME is purged above). Console login then fails with
# "failed to start session" even though authentication succeeds. VNC hides the
# problem because it launches XFCE directly via xstartup.
- name: Default the LightDM session to {{ desktop_session }} (the only installed session)
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/50-default-session.conf
    content: |
      # Managed by Ansible (desktop role).
      [Seat:*]
      user-session={{ desktop_session }}
    owner: root
    group: root
    mode: "0644"

# Self-heal hosts provisioned before the default above existed: their users
# already have "ubuntu" written into ~/.dmrc and AccountsService, which LightDM
# prefers over the system default. Rewrite only the broken "ubuntu" value so we
# never clobber a deliberately-chosen, installed session.
- name: Repair stale "ubuntu" session pointers (AccountsService + ~/.dmrc)
  ansible.builtin.shell: |
    set -eu
    changed=0
    for f in /var/lib/AccountsService/users/*; do
      [ -f "$f" ] || continue
      if grep -q '^XSession=ubuntu$' "$f"; then
        sed -i 's/^XSession=ubuntu$/XSession={{ desktop_session }}/' "$f"
        changed=1
      fi
    done
    while IFS=: read -r _ _ uid _ _ home _; do
      [ "$uid" -ge 1000 ] && [ "$uid" -ne 65534 ] || continue
      d="$home/.dmrc"
      if [ -f "$d" ] && grep -q '^Session=ubuntu$' "$d"; then
        sed -i 's/^Session=ubuntu$/Session={{ desktop_session }}/' "$d"
        changed=1
      fi
    done < /etc/passwd
    [ "$changed" -eq 1 ] && echo CHANGED || true
  register: _session_repair
  changed_when: "'CHANGED' in _session_repair.stdout"

# ── TurboVNC (amd64 only) ─────────────────────────────────────────────────────

- name: Get latest TurboVNC release version
  ansible.builtin.uri:
    url: https://api.github.com/repos/TurboVNC/turbovnc/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github.v3+json
  register: _turbovnc_release
  when: ansible_architecture == "x86_64"

# Check the installed version BEFORE downloading. `apt: deb:` fetches the whole
# .deb (~42 MB) and only then decides it is already installed, so on a slow link
# every run burns the full download and can time out (torture measured ~74 kB/s
# => ~10 min). dpkg-query's version is "3.3-20260206" for upstream tag "3.3", so
# match on the leading version component rather than comparing the whole string.
- name: Check the installed TurboVNC version (amd64)
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Version}' turbovnc
  register: _turbovnc_installed
  changed_when: false
  failed_when: false
  when: ansible_architecture == "x86_64"

- name: Download and install TurboVNC (amd64)
  ansible.builtin.apt:
    deb: "https://github.com/TurboVNC/turbovnc/releases/download/{{ _turbovnc_release.json.tag_name }}/turbovnc_{{ _turbovnc_release.json.tag_name }}_amd64.deb"
    state: present
  when:
    - ansible_architecture == "x86_64"
    - (_turbovnc_installed.rc | default(1)) != 0
      or not (_turbovnc_installed.stdout | default('')).startswith(_turbovnc_release.json.tag_name)

# ── TigerVNC (aarch64) ────────────────────────────────────────────────────────

- name: Install TigerVNC (aarch64)
  ansible.builtin.apt:
    name:
      - tigervnc-standalone-server
      - tigervnc-common
    state: present
  when: ansible_architecture == "aarch64"

# ── VNC password ──────────────────────────────────────────────────────────────

- name: Create .vnc directory for {{ desktop_user }}
  ansible.builtin.file:
    path: "/home/{{ desktop_user }}/.vnc"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0755"

# Always (re)write the password file: a `creates:` guard would pin the password
# forever at whatever was first provisioned, so a changed desktop_vnc_password
# would never take. vncpasswd output is non-deterministic, so these tasks always
# report "changed" — acceptable to keep password changes reliable.
- name: Set VNC password (TurboVNC, amd64)
  ansible.builtin.shell: |
    echo "{{ desktop_vnc_password }}" | /opt/TurboVNC/bin/vncpasswd -f > /home/{{ desktop_user }}/.vnc/passwd
    chmod 600 /home/{{ desktop_user }}/.vnc/passwd
  become: true
  become_user: "{{ desktop_user }}"
  when:
    - ansible_architecture == "x86_64"
    - not desktop_vnc_no_password
  notify: Restart vncserver

- name: Set VNC password (TigerVNC, aarch64)
  ansible.builtin.shell: |
    printf "{{ desktop_vnc_password }}\n{{ desktop_vnc_password }}\nn\n" | vncpasswd
    chmod 600 /home/{{ desktop_user }}/.vnc/passwd
  become: true
  become_user: "{{ desktop_user }}"
  when:
    - ansible_architecture == "aarch64"
    - not desktop_vnc_no_password
  notify: Restart vncserver

# ── xstartup for TigerVNC ─────────────────────────────────────────────────────

- name: Deploy xstartup for TigerVNC (aarch64)
  ansible.builtin.copy:
    dest: "/home/{{ desktop_user }}/.vnc/xstartup"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0755"
    content: |
      #!/bin/sh
      unset SESSION_MANAGER
      unset DBUS_SESSION_BUS_ADDRESS
      exec startxfce4
  when: ansible_architecture == "aarch64"

# ── Systemd user service ──────────────────────────────────────────────────────

- name: Create systemd user service directory for {{ desktop_user }}
  ansible.builtin.file:
    path: "/home/{{ desktop_user }}/.config/systemd/user"
    state: directory
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0755"

# SECURITY TYPES, and why both branches are explicit:
#   * macOS Screen Sharing.app will NOT connect to a server offering only RFB
#     type 1 ("None"). It prompts for a password, and since no password file
#     exists in that mode, nothing you type can work. So a Mac-reachable host
#     needs desktop_vnc_no_password: false.
#   * In the password branch we pin "-SecurityTypes VNC" (RFB type 2) rather
#     than letting TurboVNC pick its defaults, which advertise Tight-wrapped
#     types (OTP/UnixLogin/Plain) that Screen Sharing does not negotiate.
#     Type 2 is the one Apple's client speaks, and it is what lets the password
#     be saved in the Mac Keychain so it is only ever typed once.
#
# NOTE: TurboVNC takes -SecurityTypes None on its own. The
# --I-KNOW-THIS-IS-INSECURE confirmation flag is TigerVNC-only; TurboVNC's Xvnc
# rejects it with "Unrecognized option" and the server dies (status=255). Keep
# that flag in the TigerVNC (aarch64) unit below, but NOT here.
# TurboVNC's -vgl runs the window manager under `vglrun +wm`, and by default
# that vglrun uses the GLX back end, i.e. display :0 — which on a headless or
# console-less box gives "[VGL] ERROR: Could not open display :0" and no
# acceleration. Pinning the back end HERE, inside the vglrun command line, is
# what makes it deterministic: passing it via VGL_DISPLAY relies on the variable
# surviving vncserver -> xstartup -> window manager, and it does not reliably.
# vncserver `do`es this file as Perl, hence the trailing 1.
- name: Pin the VirtualGL back end for the VNC session
  ansible.builtin.copy:
    dest: /etc/turbovncserver.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/desktop) — do not edit by hand.
      $vglrun = "vglrun -d {{ desktop_vnc_vgl_display }} +wm";
      1;
  when:
    - ansible_architecture == "x86_64"
    - desktop_vnc_virtualgl
  notify: Restart vncserver

- name: Deploy VNC systemd user service (TurboVNC, amd64)
  ansible.builtin.copy:
    dest: "/home/{{ desktop_user }}/.config/systemd/user/vncserver.service"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"
    content: |
      [Unit]
      Description=TurboVNC server
      After=network.target

      [Service]
      Type=forking
      {% if desktop_vnc_virtualgl %}
      # GPU acceleration for the whole session. -vgl makes TurboVNC start the
      # window manager under `vglrun +wm`, so every app launched from the
      # desktop inherits VirtualGL's LD_PRELOAD — including ones started
      # indirectly, e.g. `ros2 launch ros_gz_sim ...`. Without this, only
      # commands a human remembers to prefix with vglrun get the GPU, and
      # everything else silently falls back to llvmpipe software rendering.
      #
      # VGL_DISPLAY=egl0 selects VirtualGL's EGL back end, which renders on the
      # DRM render node directly. That is what lets us skip `vglserver_config`
      # and the display-manager restart the GLX back end would require. The
      # session user must be in the `render` group to open /dev/dri/renderD*.
      Environment=VGL_DISPLAY={{ desktop_vnc_vgl_display }}
      Environment=PATH=/opt/VirtualGL/bin:/usr/local/bin:/usr/bin:/bin
      {% endif %}
      ExecStart=/opt/TurboVNC/bin/vncserver :{{ desktop_vnc_display }} \
        -geometry {{ desktop_vnc_geometry }} \
        -depth {{ desktop_vnc_depth }} \
        {% if desktop_vnc_no_password %}-SecurityTypes None {% else %}-SecurityTypes VNC {% endif %}\
        {% if desktop_vnc_virtualgl %}-vgl {% endif %}\
        -wm xfce
      ExecStop=/opt/TurboVNC/bin/vncserver -kill :{{ desktop_vnc_display }}
      Restart=on-failure

      [Install]
      WantedBy=default.target
  when: ansible_architecture == "x86_64"
  notify: Restart vncserver

- name: Deploy VNC systemd user service (TigerVNC, aarch64)
  ansible.builtin.copy:
    dest: "/home/{{ desktop_user }}/.config/systemd/user/vncserver.service"
    owner: "{{ desktop_user }}"
    group: "{{ desktop_user }}"
    mode: "0644"
    content: |
      [Unit]
      Description=TigerVNC server
      After=network.target

      [Service]
      Type=forking
      ExecStart=/usr/bin/vncserver :{{ desktop_vnc_display }} \
        -geometry {{ desktop_vnc_geometry }} \
        -depth {{ desktop_vnc_depth }} \
        {% if desktop_vnc_no_password %}-SecurityTypes None --I-KNOW-THIS-IS-INSECURE {% endif %}\
        -localhost no
      ExecStop=/usr/bin/vncserver -kill :{{ desktop_vnc_display }}
      Restart=on-failure

      [Install]
      WantedBy=default.target
  when: ansible_architecture == "aarch64"
  notify: Restart vncserver

- name: Enable lingering for {{ desktop_user }} (so user services start at boot)
  ansible.builtin.command: loginctl enable-linger {{ desktop_user }}
  args:
    creates: "/var/lib/systemd/linger/{{ desktop_user }}"

- name: Enable and start VNC user service
  ansible.builtin.systemd:
    name: vncserver
    state: started
    enabled: true
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ desktop_user }}"

# ── Default web browser ────────────────────────────────────────────────────────

- name: Install Firefox (from Mozilla apt repo, not snap)
  ansible.builtin.include_tasks: install_firefox.yml
  when: desktop_install_firefox
