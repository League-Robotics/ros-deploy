---
# roles/cameras/defaults/main.yml
# libcamera-based ROS 2 camera support (camera_ros). Designed for Raspberry Pi
# CSI cameras on Ubuntu 24.04 (libcamera stack), works with any libcamera/V4L2
# camera. Override `cameras_list` per host in inventory/host_vars/<host>.yml.

# ROS camera packages. image_transport_plugins + compressed_image_transport
# give a `.../image_raw/compressed` topic — important for viewing over the LAN
# (e.g. from the Mac) without saturating the network with raw frames.
cameras_apt_packages:
  # The libcamera IPA (Image Processing Algorithms) modules — ipa_rpi_vc4.so
  # and friends. WITHOUT this, libcamera enumerates the sensor and its controls
  # but then refuses to register the camera:
  #   ERROR RPI pipeline_base.cpp:804 Failed to load a suitable IPA library
  #   ERROR RPI vc4.cpp:206 Failed to register camera imx219 10-0010: -22
  # camera_ros then dies with "no cameras available". The IPA also drives AE/AGC,
  # so a raw v4l2 grab on such a host streams at full framerate but every frame
  # is ALL ZEROS (black) — the sensor is never told to expose. Not pulled in as a
  # dependency of libcamera0.2 on Ubuntu 24.04, so it must be requested explicitly.
  - libcamera-ipa
  - "ros-{{ ros_version }}-camera-ros"
  - "ros-{{ ros_version }}-camera-info-manager"
  - "ros-{{ ros_version }}-image-transport"
  - "ros-{{ ros_version }}-image-transport-plugins"
  - "ros-{{ ros_version }}-compressed-image-transport"
  - "ros-{{ ros_version }}-image-view"
  - "ros-{{ ros_version }}-rqt-image-view"

# Directory holding the generated launch file.
cameras_config_dir: /opt/ros-cameras

# ── Raspberry Pi libcamera (built from source) ────────────
# camera_ros ships UPSTREAM libcamera, whose PiSP pipeline cannot acquire the
# Raspberry Pi downstream kernel's CFE ("Unable to acquire a CFE instance").
# On Pi 5 + Ubuntu, build the Raspberry Pi libcamera fork (matching the
# linux-raspi kernel) and make camera_ros load it via LD_LIBRARY_PATH.
# Enable per host (e.g. vidar) with `cameras_build_rpi_libcamera: true`.
cameras_build_rpi_libcamera: false
rpi_libcamera_prefix: /opt/rpi-libcamera
rpi_libcamera_src: /opt/src
# Profile snippet that prepends the Pi libcamera for interactive shells. Named
# to sort AFTER ros_env.sh / ros_overlay.sh so it wins the LD_LIBRARY_PATH race.
cameras_env_profile_path: /etc/profile.d/zz-ros-cameras.sh
# Pin libcamera to a 0.5.x tag so its SONAME (libcamera.so.0.5) matches the
# ros-*-camera-ros build it must substitute for. libpisp tracks its default branch.
rpi_libcamera_version: "v0.5.2+rpt20250903"
rpi_libcamera_build_deps:
  - build-essential
  - meson
  - ninja-build
  - pkg-config
  - git
  - python3-yaml
  - python3-ply
  - python3-jinja2
  - libyaml-dev
  - libssl-dev
  - openssl
  - libudev-dev
  - libboost-dev
  - nlohmann-json3-dev
  - libevent-dev
  - libdrm-dev

# Run the cameras as a systemd service (auto-start on boot, restart on failure).
cameras_systemd_service: true
cameras_service_name: ros-cameras

# Serve the camera topics as MJPEG over HTTP via web_video_server. This is the
# robust way to view cameras on a Mac (browser, no X11/XQuartz). View at
# http://<host>:<port>/stream_viewer?topic=/camera0/camera/image_raw
cameras_web_video_server: false
cameras_web_video_port: 8080
cameras_web_video_service_name: web-video-server

# ── R/B channel swap: a SENSOR property, derived — do not hand-tune ──────────
# camera_ros publishes some sensors with R/B reversed vs the encoding label.
# Measured on hardware 2026-07-31 (history in host_vars/skadi.yml): the swap
# follows the SENSOR MODEL, not the host, Pi generation, or libcamera pipeline.
# Fixing it per host is why the fleet kept flip-flopping ("more than half the
# time the cameras are red/blue swapped" — Eric, 2026-08-09).
#
# THE RULE: declare `sensor:` on every cameras_list entry. swap_rb and the
# colour-relay service derive from this table automatically; the corrected
# stream is <ns>/camera/image_color, and the watchdog probes the right topic.
# Only set swap_rb explicitly for a sensor not yet in this table — and then
# add the measurement here so the next camera is right the first time.
cameras_sensor_rb_swapped:
  imx296: true     # Global Shutter Camera — mislabeled, needs the swap
  imx219: false    # Camera Module v2 — correct as published
  imx708: false    # Camera Module 3 — correct as published

# Force-enable the relay regardless of the table (rarely needed). When any
# camera resolves to swap_rb, the relay turns on by itself.
cameras_color_relay: false
cameras_color_relay_service_name: camera-color-relay

# Watchdog: camera_ros/libcamera can stall (process stays alive but stops
# publishing) — systemd can't detect that. This timer probes the first camera
# topic and restarts the camera service (web_video_server follows via PartOf)
# if no frames are flowing.
cameras_watchdog: false
cameras_watchdog_interval: 120     # seconds between checks. Kept well under the
                                   # ~20-30 s that a web_video_server stall takes
                                   # to clear on its own, so a viewer sees at
                                   # most one probe interval of downtime.
cameras_watchdog_probe_secs: 8     # how long to sample the topic before deciding
cameras_watchdog_min_rate: 3       # restart if publish rate drops below this (Hz)

# Second probe: web_video_server 3.1.0 wedges its HTTP listener under /snapshot
# request pressure while ROS keeps publishing normally, and never self-heals.
# The rate check above cannot see that (the ROS side really is healthy), so the
# watchdog also reads a few bytes off /stream and restarts ONLY the HTTP server
# if nothing comes back. Applies when cameras_web_video_server is enabled.
# Must exceed the SLOWEST host's frame time or the watchdog restarts a host
# that is merely slow: measured 2026-07-31, one 640x480 frame takes 0.5 s on
# baldur but 3.4 s on skadi, 9.8 s on vidar and up to 12.8 s on ali. A 6 s
# budget was killing the
# slow hosts every cycle, so they never stayed up long enough to serve the
# viewer page (uptimes under 35 s across the board).
cameras_watchdog_http_secs: 40         # seconds to read from /stream
cameras_watchdog_http_min_bytes: 2000  # less than this = wedged (a partial JPEG
                                       # frame already exceeds it; 0 is the
                                       # signature of a wedged listener)

# OS user the camera service runs as. Must be able to access camera devices;
# the role adds it to `cameras_device_groups`.
cameras_user: "{{ ansible_managed_user | default('ansible') }}"
cameras_device_groups:
  - video
  - render

# Cameras to launch — one camera_ros camera_node per entry.
#   namespace : topic namespace → /<namespace>/image_raw, /camera_info, ...
#   camera    : libcamera camera index (0, 1, ...) or string camera id
#   width/height : requested capture size (camera_ros picks the closest mode)
#   frame_id  : TF frame stamped on the images
# Default is a single camera; hosts with more (e.g. vidar) override this list.
cameras_list:
  - namespace: camera0
    camera: 0
    width: 1280
    height: 720
    frame_id: camera0_optical_frame
