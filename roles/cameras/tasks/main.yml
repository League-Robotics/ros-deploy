---
# roles/cameras/tasks/main.yml
# Installs camera_ros (libcamera-based ROS 2 camera node) plus image_transport
# and compressed transport, then runs one camera_node per configured camera.
# camera_ros publishes <ns>/image_raw, <ns>/image_raw/compressed and
# <ns>/camera_info so peers (e.g. the Mac) can view the streams over the LAN.

- name: Install ROS camera packages (camera_ros + image transport)
  ansible.builtin.apt:
    name: "{{ cameras_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# On Pi 5 + Ubuntu, build the Raspberry Pi libcamera fork so camera_ros can
# actually acquire the cameras (upstream libcamera can't drive the Pi CFE).
- name: Build Raspberry Pi libcamera (Pi hosts only)
  ansible.builtin.include_tasks: rpi_libcamera.yml
  when: cameras_build_rpi_libcamera | default(false)

- name: Add camera service user to device groups (video, render)
  ansible.builtin.user:
    name: "{{ cameras_user }}"
    groups: "{{ cameras_device_groups }}"
    append: true

- name: Ensure camera config directory exists
  ansible.builtin.file:
    path: "{{ cameras_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy interactive libcamera-override profile snippet
  ansible.builtin.template:
    src: zz-ros-cameras.sh.j2
    dest: "{{ cameras_env_profile_path }}"
    owner: root
    group: root
    mode: "0644"
  when: cameras_build_rpi_libcamera | default(false)

- name: Deploy camera launch file
  ansible.builtin.template:
    src: cameras.launch.py.j2
    dest: "{{ cameras_config_dir }}/cameras.launch.py"
    owner: root
    group: root
    mode: "0644"
  notify: Restart cameras service

- name: Deploy cameras systemd unit
  ansible.builtin.template:
    src: ros-cameras.service.j2
    dest: "/etc/systemd/system/{{ cameras_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: cameras_systemd_service | bool
  notify:
    - Reload systemd
    - Restart cameras service

- name: Enable and start cameras service
  ansible.builtin.systemd:
    name: "{{ cameras_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_systemd_service | bool

# Optional: republish images with R/B corrected (camera_ros mislabel workaround).
- name: Deploy camera colour relay script
  ansible.builtin.copy:
    src: camera_color_relay.py
    dest: "{{ cameras_config_dir }}/camera_color_relay.py"
    owner: root
    group: root
    mode: "0755"
  when: cameras_color_relay | bool

- name: Deploy camera colour relay systemd unit
  ansible.builtin.template:
    src: camera-color-relay.service.j2
    dest: "/etc/systemd/system/{{ cameras_color_relay_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: cameras_color_relay | bool
  notify:
    - Reload systemd
    - Restart camera colour relay

- name: Enable and start camera colour relay
  ansible.builtin.systemd:
    name: "{{ cameras_color_relay_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_color_relay | bool

# Optional: serve the camera topics as MJPEG over HTTP (browser viewing).
- name: Install web_video_server
  ansible.builtin.apt:
    name: "ros-{{ ros_version }}-web-video-server"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: cameras_web_video_server | bool

- name: Deploy web_video_server systemd unit
  ansible.builtin.template:
    src: web-video-server.service.j2
    dest: "/etc/systemd/system/{{ cameras_web_video_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: cameras_web_video_server | bool
  notify:
    - Reload systemd
    - Restart web video server

- name: Enable and start web_video_server
  ansible.builtin.systemd:
    name: "{{ cameras_web_video_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_web_video_server | bool

# Watchdog: restart the cameras automatically if they stall (no frames).
- name: Deploy camera watchdog script
  ansible.builtin.template:
    src: camera-watchdog.sh.j2
    dest: "{{ cameras_config_dir }}/camera-watchdog.sh"
    owner: root
    group: root
    mode: "0755"
  when: cameras_watchdog | bool

- name: Deploy camera watchdog service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - camera-watchdog.service
    - camera-watchdog.timer
  when: cameras_watchdog | bool

- name: Enable and start the camera watchdog timer
  ansible.builtin.systemd:
    name: camera-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_watchdog | bool
