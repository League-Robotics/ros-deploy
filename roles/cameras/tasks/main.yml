---
# roles/cameras/tasks/main.yml
# Installs camera_ros (libcamera-based ROS 2 camera node) plus image_transport
# and compressed transport, then runs one camera_node per configured camera.
# camera_ros publishes <ns>/image_raw, <ns>/image_raw/compressed and
# <ns>/camera_info so peers (e.g. the Mac) can view the streams over the LAN.

# Resolve each camera's R/B swap from the sensor table (see defaults). After
# this, templates use cameras_list_resolved and never guess.
- name: Resolve per-camera R/B swap from the sensor table
  ansible.builtin.set_fact:
    cameras_list_resolved: >-
      {{ (cameras_list_resolved | default([])) + [ item | combine({'swap_rb':
         item.swap_rb | default(cameras_sensor_rb_swapped.get(item.sensor | default('') | lower, false))}) ] }}
  loop: "{{ cameras_list }}"

- name: Derive whether the colour relay is needed
  ansible.builtin.set_fact:
    cameras_color_relay_effective: >-
      {{ (cameras_color_relay | bool) or
         (cameras_list_resolved | default([]) | selectattr('swap_rb') | list | length > 0) }}

- name: Install ROS camera packages (camera_ros + image transport)
  ansible.builtin.apt:
    name: "{{ cameras_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# On Pi 5 + Ubuntu, build the Raspberry Pi libcamera fork so camera_ros can
# actually acquire the cameras (upstream libcamera can't drive the Pi CFE).
- name: Build Raspberry Pi libcamera (Pi hosts only)
  ansible.builtin.include_tasks: rpi_libcamera.yml
  when: cameras_build_rpi_libcamera | default(false)

- name: Add camera service user to device groups (video, render)
  ansible.builtin.user:
    name: "{{ cameras_user }}"
    groups: "{{ cameras_device_groups }}"
    append: true

- name: Ensure camera config directory exists
  ansible.builtin.file:
    path: "{{ cameras_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy interactive libcamera-override profile snippet
  ansible.builtin.template:
    src: zz-ros-cameras.sh.j2
    dest: "{{ cameras_env_profile_path }}"
    owner: root
    group: root
    mode: "0644"
  when: cameras_build_rpi_libcamera | default(false)

- name: Deploy camera launch file
  ansible.builtin.template:
    src: cameras.launch.py.j2
    dest: "{{ cameras_config_dir }}/cameras.launch.py"
    owner: root
    group: root
    mode: "0644"
  notify: Restart cameras service

- name: Deploy cameras systemd unit
  ansible.builtin.template:
    src: ros-cameras.service.j2
    dest: "/etc/systemd/system/{{ cameras_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: cameras_systemd_service | bool
  notify:
    - Reload systemd
    - Restart cameras service

- name: Enable and start cameras service
  ansible.builtin.systemd:
    name: "{{ cameras_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_systemd_service | bool

# Optional: republish images with R/B corrected (camera_ros mislabel workaround).
- name: Deploy camera colour relay script
  ansible.builtin.copy:
    src: camera_color_relay.py
    dest: "{{ cameras_config_dir }}/camera_color_relay.py"
    owner: root
    group: root
    mode: "0755"
  when: cameras_color_relay_effective | bool

- name: Deploy camera colour relay systemd unit
  ansible.builtin.template:
    src: camera-color-relay.service.j2
    dest: "/etc/systemd/system/{{ cameras_color_relay_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: cameras_color_relay_effective | bool
  notify:
    - Reload systemd
    - Restart camera colour relay

- name: Enable and start camera colour relay
  ansible.builtin.systemd:
    name: "{{ cameras_color_relay_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_color_relay_effective | bool

# Teardown: if the relay is disabled, remove any previously-deployed relay so the
# flag is declarative. (Stock-libcamera hosts must NOT run it — it would swap R/B.)
- name: Remove camera colour relay when disabled
  when: not (cameras_color_relay_effective | bool)
  block:
    - name: Check whether the colour relay unit is present
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ cameras_color_relay_service_name }}.service"
      register: _cameras_color_relay_unit

    - name: Stop and disable the colour relay
      ansible.builtin.systemd:
        name: "{{ cameras_color_relay_service_name }}"
        state: stopped
        enabled: false
      when: _cameras_color_relay_unit.stat.exists

    - name: Remove the colour relay unit and script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/systemd/system/{{ cameras_color_relay_service_name }}.service"
        - "{{ cameras_config_dir }}/camera_color_relay.py"
      notify: Reload systemd

# Optional: serve the camera topics as MJPEG over HTTP (browser viewing).
- name: Install web_video_server
  ansible.builtin.apt:
    name: "ros-{{ ros_version }}-web-video-server"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: cameras_web_video_server | bool

- name: Deploy web_video_server systemd unit
  ansible.builtin.template:
    src: web-video-server.service.j2
    dest: "/etc/systemd/system/{{ cameras_web_video_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: cameras_web_video_server | bool
  notify:
    - Reload systemd
    - Restart web video server

- name: Enable and start web_video_server
  ansible.builtin.systemd:
    name: "{{ cameras_web_video_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_web_video_server | bool

# Teardown: if web_video_server is disabled, remove a previously-deployed unit.
- name: Remove web_video_server when disabled
  when: not (cameras_web_video_server | bool)
  block:
    - name: Check whether the web_video_server unit is present
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ cameras_web_video_service_name }}.service"
      register: _cameras_web_video_unit

    - name: Stop and disable web_video_server
      ansible.builtin.systemd:
        name: "{{ cameras_web_video_service_name }}"
        state: stopped
        enabled: false
      when: _cameras_web_video_unit.stat.exists

    - name: Remove the web_video_server unit
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ cameras_web_video_service_name }}.service"
        state: absent
      notify: Reload systemd

# Watchdog: restart the cameras automatically if they stall (no frames).
- name: Deploy camera watchdog script
  ansible.builtin.template:
    src: camera-watchdog.sh.j2
    dest: "{{ cameras_config_dir }}/camera-watchdog.sh"
    owner: root
    group: root
    mode: "0755"
  when: cameras_watchdog | bool

- name: Deploy camera watchdog service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - camera-watchdog.service
    - camera-watchdog.timer
  when: cameras_watchdog | bool

- name: Enable and start the camera watchdog timer
  ansible.builtin.systemd:
    name: camera-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  when: cameras_watchdog | bool

# Teardown: if the watchdog is disabled, remove a previously-deployed timer,
# service, and probe script so it stops restarting the cameras.
- name: Remove the camera watchdog when disabled
  when: not (cameras_watchdog | bool)
  block:
    - name: Check whether the watchdog timer is present
      ansible.builtin.stat:
        path: /etc/systemd/system/camera-watchdog.timer
      register: _cameras_watchdog_timer

    - name: Stop and disable the watchdog timer and service
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - camera-watchdog.timer
        - camera-watchdog.service
      when: _cameras_watchdog_timer.stat.exists

    - name: Remove the watchdog units and probe script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/camera-watchdog.timer
        - /etc/systemd/system/camera-watchdog.service
        - "{{ cameras_config_dir }}/camera-watchdog.sh"
      notify: Reload systemd
